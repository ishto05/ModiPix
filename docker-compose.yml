# modipix-prototype/docker-compose.yml
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend  # ← Fixed: specify the correct dockerfile name
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MODERATION_PROVIDER=nudenet  # Start with existing, switch to sightengine later
      - MODERATION_SERVICE_URL=http://moderation_service:8000
      # SightEngine credentials (will be read from .env when you switch)
      - SIGHTENGINE_API_USER=${SIGHTENGINE_API_USER}
      - SIGHTENGINE_API_SECRET=${SIGHTENGINE_API_SECRET}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads:/app/uploads
    networks:
      - modipix-network
    depends_on:
      - moderation_service

  moderation_service:
    build:
      context: ./modipix-microservice
      dockerfile: Dockerfile.microservice
    ports:
      - "8000:8000"
    volumes:
      - ./modipix-microservice:/app
      - /app/src/__pycache__
    networks:
      - modipix-network

volumes:
  uploads:

networks:
  modipix-network:
    driver: bridge